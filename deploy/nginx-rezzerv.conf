server {
    server_name 5.10.220.137.sslip.io 5.10.220.137;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # `Connection: upgrade` KOŞULLU veriliyor ($connection_upgrade map'i
        # conf.d/websocket-upgrade.conf içinde). Koşulsuz verilirse WebSocket
        # olmayan her istek de "yükselt" diye işaretlenir; nginx için bilinen
        # bir yanlış yapılandırma.
        #
        # NOT: bu ayar bir arıza gidermek için değil, doğru olduğu için
        # burada. Kurulum sırasında giriş formunun çalışmadığı sanılmış ve
        # sebep buraya yazılmıştı; gerçek sebep tarayıcı aracının alanları
        # doldurmamasıydı. Loglardaki "Server Reference ID" hataları da bu
        # uygulamadan değil, dışarıdan gelen bir tarama botundan geliyordu.
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Üretimde oturum çerezi Secure işaretli; bu başlık olmadan Next
        # isteği http sanar ve çerez hiç geri gelmez.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/rezzerv.access.log;
    error_log  /var/log/nginx/rezzerv.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/5.10.220.137.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/5.10.220.137.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name 5.10.220.137.sslip.io 5.10.220.137;

    # KANONİK adrese yönlendiriliyor, $host ile değil.
    #
    # certbot'un ürettiği blok yalnızca sslip.io adını yönlendiriyor, çıplak
    # IP'ye 404 dönüyordu: adresi IP olarak bilen ziyaretçi uygulamaya hiç
    # ulaşamıyordu. $host kullanılsaydı bu kez https://5.10.220.137 adresine
    # gidilirdi ve sertifika o adı kapsamadığı için tarayıcı uyarı verirdi.
    return 301 https://5.10.220.137.sslip.io$request_uri;
}
