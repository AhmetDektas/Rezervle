<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bağlantı yok · Rezzerv</title>
<style>
  :root { color-scheme: light }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#F5F8FC;
         font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; color:#0B1F3A }
  .box { max-width:380px; padding:32px 24px; text-align:center }
  .mark { width:56px; height:56px; border-radius:16px; margin:0 auto 20px;
          background:linear-gradient(135deg,#3B85FF,#0E52D9); display:grid; place-items:center;
          color:#fff; font-weight:700; font-size:26px }
  h1 { font-size:20px; margin:0 0 8px; letter-spacing:-.02em }
  p { font-size:14px; line-height:1.6; color:#41536B; margin:0 0 20px }
  a { display:inline-block; background:#176BFF; color:#fff; text-decoration:none;
      padding:12px 20px; border-radius:12px; font-size:14px; font-weight:500 }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">R</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>
      Randevu saatlerini canlı gösterebilmek için bağlantıya ihtiyacımız var.
      Bağlantınız geri geldiğinde kaldığınız yerden devam edebilirsiniz.
    </p>
    <a href="/">Tekrar dene</a>
  </div>
</body>
</html>
