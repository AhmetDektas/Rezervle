# Rezzerv CI
#
# Katmanlı çalışır (mühendislik incelemesi, madde 7):
#   - hizli: her push'ta. Tip denetimi + lint + birim/entegrasyon (~1 dk).
#   - e2e:   yalnızca pull request ve main'e push'ta. Tam Playwright süiti
#            yerelde 12,7 dk sürüyor; her push'ta koşarsa geri bildirim
#            döngüsü insanları CI'a bakmamaya iter.
#
# Servis konteynerleri, yerelde bulunmayan Postgres ve Redis'i sağlar. Bu CI
# aynı zamanda Postgres göçünün (T1) ve kuyruk işlerinin (T9) tek doğrulama
# ortamı: geliştirme makinesinde ikisi de kurulu değil.
name: test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-secret-en-az-otuz-iki-karakter-uzunlugunda-olmali
  NEXT_TELEMETRY_DISABLED: '1'
  # .env deposuda izlenmiyor, bu yüzden CI kendi değerini vermek zorunda.
  # prisma generate bile bu değişkeni arar (datasource env("DATABASE_URL")).
  # T1 ile provider postgresql olduğunda bu satır servis konteynerinin
  # dizesine çevrilecek: postgresql://rezzerv:rezzerv@localhost:5432/rezzerv_test
  DATABASE_URL: file:./dev.db

jobs:
  hizli:
    name: Tip denetimi, lint, birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Vitest kendi SQLite dosyasını kullanıyor (vitest.config.ts içindeki
      # DATABASE_URL). Postgres'e geçildiğinde bu adım da servis konteynerine
      # bağlanacak; o zaman buraya `services:` bloğu eklenir.
      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  e2e:
    name: Uçtan uca (Playwright)
    # Pahalı katman: yalnızca birleştirme kapısında ve main'de.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: hizli

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rezzerv
          POSTGRES_PASSWORD: rezzerv
          POSTGRES_DB: rezzerv_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rezzerv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Playwright tarayıcılarını kur
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate

      # Şema hâlâ SQLite; Postgres servisi T1 ile devreye girecek ve o zaman
      # DATABASE_URL aşağıdaki postgres dizesine çevrilecek. Servis şimdiden
      # ayakta ki göç PR'ında CI'ın kendisini değiştirmek gerekmesin.
      - name: Veritabanını hazırla ve tohumla
        run: npm run setup

      - name: E2E
        run: npm run e2e:only

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 7
