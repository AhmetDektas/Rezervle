# Rezzerv CI
#
# Katmanlı çalışır (mühendislik incelemesi, madde 7):
#   - hizli: her push'ta. Tip denetimi + lint + birim/entegrasyon (~1-2 dk).
#   - e2e:   yalnızca pull request ve main'e push'ta. Tam Playwright süiti
#            yerelde 12,7 dk sürüyor; her push'ta koşarsa geri bildirim
#            döngüsü insanları CI'a bakmamaya iter.
#
# Her iki iş de Postgres servisine bağlanır: T1 göçünden sonra entegrasyon
# testleri de gerçek veritabanı istiyor. Redis yalnızca e2e işinde; kuyruk
# işleri henüz E2E akışına girmedi ama servis şimdiden ayakta ki iş
# eklendiğinde CI'ın kendisini değiştirmek gerekmesin.
name: test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-secret-en-az-otuz-iki-karakter-uzunlugunda-olmali
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  hizli:
    name: Tip denetimi, lint, birim testleri
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rezzerv
          POSTGRES_PASSWORD: rezzerv
          POSTGRES_DB: rezzerv_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rezzerv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Bu iste yalnizca testler kosuyor, bu yuzden servisin varsayilan
      # veritabani dogrudan test veritabani olarak kullaniliyor;
      # global-setup.ts her kosuda onu sifirliyor.
      DATABASE_URL: postgresql://rezzerv:rezzerv@localhost:5432/rezzerv_test?schema=public
      TEST_DATABASE_URL: postgresql://rezzerv:rezzerv@localhost:5432/rezzerv_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  e2e:
    name: Uçtan uca (Playwright)
    # Pahalı katman: yalnızca birleştirme kapısında ve main'de.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: hizli

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rezzerv
          POSTGRES_PASSWORD: rezzerv
          POSTGRES_DB: rezzerv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rezzerv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rezzerv:rezzerv@localhost:5432/rezzerv?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Playwright tarayıcılarını kur
        run: npx playwright install --with-deps chromium

      - name: Şemayı uygula ve tohumla
        run: npm run setup

      - name: E2E
        run: npm run e2e:only

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 7
